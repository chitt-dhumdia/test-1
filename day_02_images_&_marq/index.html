<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>images and marquee</title>
</head>
<body>

    <h1 style="text-align: center;">IMAGES</h1><hr/>

    <img src="https://c.ndtvimg.com/2025-04/d77m53ig_csa_625x300_17_April_25.jpg?im=FeatureCrop,algorithm=dnn,width=806,height=605" width="200px" alt="hitman" title="Hitman"><hr/>
    <img src="./img/img1.jpg" alt="marco" title="killing machine">

    <hr/><h1 style="text-align: center;">Marquee</h1><hr/>
    <marquee behavior="" direction="right" scrollamount="40px">
        <img src="https://media3.giphy.com/media/vNXtRF3ZmGBwhDM09w/200w.gif?cid=6c09b952i628f9z4167kz4cwen2bn9mgdmgrdb98aqwkqupn&ep=v1_stickers_search&rid=200w.gif&ct=s" alt="football" height="120px">
    </marquee>
    <hr/>
    <marquee behavior="" direction="left" scrollamount="40px">
        <img src="https://media3.giphy.com/media/vNXtRF3ZmGBwhDM09w/200w.gif?cid=6c09b952i628f9z4167kz4cwen2bn9mgdmgrdb98aqwkqupn&ep=v1_stickers_search&rid=200w.gif&ct=s" alt="football" height="120px">
    </marquee>
    <hr/>
    <marquee behavior="slide" direction="right" scrollamount="40px">
        <img src="https://media3.giphy.com/media/vNXtRF3ZmGBwhDM09w/200w.gif?cid=6c09b952i628f9z4167kz4cwen2bn9mgdmgrdb98aqwkqupn&ep=v1_stickers_search&rid=200w.gif&ct=s" alt="football" height="120px">
    </marquee>
    <hr/>
    <marquee behavior="slide" direction="left" scrollamount="40px">
        <img src="https://media3.giphy.com/media/vNXtRF3ZmGBwhDM09w/200w.gif?cid=6c09b952i628f9z4167kz4cwen2bn9mgdmgrdb98aqwkqupn&ep=v1_stickers_search&rid=200w.gif&ct=s" alt="football" height="120px">
    </marquee>
    <hr/>
    <marquee behavior="alternate" direction="left" scrollamount="40px">
        <img src="https://media3.giphy.com/media/vNXtRF3ZmGBwhDM09w/200w.gif?cid=6c09b952i628f9z4167kz4cwen2bn9mgdmgrdb98aqwkqupn&ep=v1_stickers_search&rid=200w.gif&ct=s" alt="football" height="120px">

</html>
